[project]
name = "totalforsvaret"
version = "0.1.0"
description = "Öppen kunskapsgraf, Hybrid-RAG, react-force-graph-export och MCP-server för det svenska totalförsvaret och NATO-ramverk."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Fredrik Linnander" }
]
dependencies = [
  "pyyaml>=6.0.2",
  "httpx>=0.28.1",
  "pydantic>=2.10.0",
  "mcp>=2.0.0",
  "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
totalforsvaret = "totalforsvaret.cli:main"
totalforsvaret-mcp = "totalforsvaret.mcp_server:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/totalforsvaret"]
