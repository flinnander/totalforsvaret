# Masterkatalog över övervakade källor och domäner för Totalförsvaret MCP/RAG
# Repo: https://github.com/flinnander/totalforsvaret
#
# Grundprincip (se SECURITY_AND_SCOPE.md):
# "Struktur, Roller & Formella Krav JA – Uppfyllnad, Förmågegap & Sårbarheter NEJ"
# Vi aggregerar ENDAST öppna källor om vad totalförsvaret ÄR, vilka som ingår och vilka lagar/krav
# som gäller. Vi exkluderar aktivt hur väl enskilda aktörer svarar upp mot kraven.

version: "1.1"
updated: "2026-11-25"

ingestion_defaults:
  respect_robots_txt: true
  user_agent: "Totalforsvaret-OpenRAG-Bot/1.0 (+https://github.com/flinnander/totalforsvaret)"
  require_source_url: true
  require_timestamp: true

# Automatiska säkerhets- och avgränsningsfilter vid inhämtning
exclusion_rules:
  exclude_compliance_and_capability_assessments: true
  exclude_physical_infrastructure_coordinates: true
  blocked_doc_patterns:
    - "risk- och sårbarhetsanalys"
    - "risk-och-sarbarhetsanalys"
    - "rsa-"
    - "förmågebedömning"
    - "mognadsbedömning"
    - "tillsynsbeslut"
    - "brister i beredskapen"
    - "uppföljning av beredskapsförmåga"
    - "återrapportering"
    - "skyddsobjekt"

# ==============================================================================
# 1. RIKSDAG, REGERING, RÄTTSINFORMATION & REGLERINGSBREV (FORMELLA KRAV)
# ==============================================================================
core_governance_sources:
  - id: riksdagen_open_data
    name: "Riksdagens Öppna Data"
    domain: "data.riksdagen.se"
    base_urls:
      - "https://data.riksdagen.se/dokumentlista/"
    method: "rest_api"
    schedule: "weekly"
    doc_types: ["sfs", "prop", "sou", "ds", "bet", "skr"]
    filters:
      keywords:
        - "totalförsvar"
        - "civilt försvar"
        - "höjd beredskap"
        - "beredskapsmyndighet"
        - "beredskapssektor"
        - "krigsorganisation"
        - "allmän tjänsteplikt"
        - "värdlandsstöd"
        - "NATO"
        - "NCRS"
        - "försörjningsberedskap"
      key_sfs:
        - "1992:1403" # Lag om totalförsvar och höjd beredskap
        - "2015:1053" # Förordning om totalförsvar och höjd beredskap
        - "2022:524"  # Förordning om statliga myndigheters beredskap (inkl. ändringar 2025:742, 2026 m.fl.)
        - "2006:544"  # Lag om kommuners och regioners åtgärder inför och vid extraordinära händelser i fredstid och höjd beredskap (LEH)
        - "2006:637"  # Förordning om kommuners och regioners åtgärder (FEH)
        - "1994:1809" # Lag om totalförsvarsplikt
        - "1982:1004" # Lag om skyldighet för näringsidkare, arbetsmarknadsorganisationer m.fl. att delta i totalförsvarsplaneringen
        - "1978:599"  # Förfogandelag
        - "1978:561"  # Ransoneringslag
        - "2018:585"  # Säkerhetsskyddslag (endast lagtext/normativt regelverk)
        - "2020:782"  # Lag om operativt militärt stöd / Värdlandsstöd & DCA-relaterad lagstiftning

  - id: regeringen
    name: "Regeringskansliet"
    domain: "regeringen.se"
    base_urls:
      - "https://www.regeringen.se/sveriges-regering/forsvarsdepartementet/"
      - "https://www.regeringen.se/regeringens-politik/totalforsvar/"
      - "https://www.regeringen.se/regeringens-politik/civilt-forsvar/"
      - "https://www.regeringen.se/regeringens-politik/sverige-och-nato/"
      - "https://www.regeringen.se/rattsliga-dokument/"
    method: "rss_and_curated_web"
    schedule: "weekly"
    doc_types: ["regeringsbeslut", "kommittedirektiv", "strategi", "regleringsbrev", "ds", "sou"]

  - id: esv_statsliggaren
    name: "Ekonomistyrningsverket (ESV) & Statsliggaren – Regleringsbrev"
    domain: "esv.se"
    base_urls:
      - "https://www.esv.se/statsliggaren/"
    method: "structured_scraper"
    schedule: "monthly" # Särskilt intensiv körning december–januari samt vid ändringsbudgetar
    doc_types: ["regleringsbrev"]
    scope_notes: >
      Hämtar ENDAST regeringens formella mål, uppdrag och anslagsvillkor i regleringsbreven
      (Utgiftsområde 6 samt beredskapsmyndigheternas regleringsbrev). Myndigheternas efterföljande
      återrapporteringar om måluppfyllnad eller brister hämtas EJ.

  - id: riksbanken
    name: "Sveriges riksbank (Riksdagsmyndighet – Regelverk & roll i finansiell beredskap)"
    domain: "riksbank.se"
    base_urls:
      - "https://www.riksbank.se/sv/betalningar--kontanter/beredskap/"
    method: "curated_web_and_pdf"
    schedule: "monthly"
    doc_types: ["föreskrift", "rollbeskrivning"]

# ==============================================================================
# 2. NATO, ALLIANSFÖRPLIKTELSER & CRISIS RESPONSE MEASURES (KONCEPT & KRAVRAMVERK)
# ==============================================================================
nato_and_alliance_sources:
  - id: nato_hq
    name: "NATO Official Portal (Resilience, Article 3, NCRS/NRS, Deterrence & Defence)"
    domain: "nato.int"
    base_urls:
      - "https://www.nato.int/cps/en/natohq/topics_132722.htm" # Resilience, civil preparedness and Article 3
      - "https://www.nato.int/cps/en/natohq/topics_49288.htm"  # Crisis management (NCRS / NRS)
      - "https://www.nato.int/cps/en/natohq/official_texts.htm"
    method: "curated_web"
    schedule: "monthly"
    doc_types: ["nato_policy", "official_text", "baseline_requirements"]
    scope_notes: >
      Fokus på vad NATO:s ramverk innebär konceptuellt och formellt: de 7 grundläggande kraven på civil
      motståndskraft (Seven Baseline Requirements), hur NATO Crisis Response System (NCRS) / NATO Response
      System (NRS) och Crisis Response Measures (CRM) fungerar som system, NDPP samt Värdlandsstöd (HNS).
      Inga landspecifika förmågegranskningar eller uppfyllnadsbedömningar inkluderas.

  - id: nato_act_and_shape
    name: "NATO Allied Command Transformation (ACT) & SHAPE"
    domain: "act.nato.int"
    secondary_domains: ["shape.nato.int", "nso.nato.int"]
    base_urls:
      - "https://www.act.nato.int/"
      - "https://shape.nato.int/"
    method: "curated_web_and_pdf"
    schedule: "quarterly"
    doc_types: ["nato_doctrine", "hns_guidance"]
    scope_notes: "Öppna doktriner och standardramverk (t.ex. AJP för Host Nation Support och CIMIC)."

  - id: nato_hybrid_and_cyber_coe
    name: "European Centre of Excellence for Countering Hybrid Threats & NATO CCDCOE"
    domain: "hybridcoe.fi"
    secondary_domains: ["ccdcoe.org"]
    base_urls:
      - "https://www.hybridcoe.fi/publications/"
      - "https://ccdcoe.org/library/publications/"
    method: "curated_web_and_pdf"
    schedule: "quarterly"
    doc_types: ["begreppsramverk", "metodhandbok"]

